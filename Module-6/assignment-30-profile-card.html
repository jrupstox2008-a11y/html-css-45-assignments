
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 30 - Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
        }

        .profile-card {
            position: relative;
            max-width: 350px;
            margin: 40px auto;
            padding: 30px 25px;
            background-color: white;
            border: 1px solid #dbe3ee;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .profile-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 10px;
            background-color: #dcfce7;
            color: #166534;
            border-radius: 20px;
            font-size: 12px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: 15px auto;
            border-radius: 50%;
            background-color: #dbeafe;
            color: #1d4ed8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 8px;
            color: #17365d;
            font-size: 26px;
        }

        .role {
            color: #64748b;
            margin-bottom: 18px;
        }

        .description {
            line-height: 1.6;
            color: #334155;
        }

        .profile-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 22px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .profile-button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <article class="profile-card">
        <span class="profile-badge">Student</span>

        <div class="avatar" aria-label="Profile initials">AS</div>

        <h1>My Profile</h1>
        <p class="role">HTML & CSS Learner</p>

        <p class="description">
            I am learning web development and building
            creative projects to improve my skills.
        </p>

        <a class="profile-button" href="mailto:student@example.com">
            Contact Me
        </a>
    </article>

</body>
</html>
