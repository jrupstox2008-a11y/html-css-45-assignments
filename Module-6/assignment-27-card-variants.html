
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 27 - Card Variants</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #17365d;
        }

        .card-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .card {
            width: 220px;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .card-one {
            background-color: white;
            border: 2px solid #2563eb;
        }

        .card-two {
            background-color: #dbeafe;
            border-radius: 25px;
        }

        .card-three {
            background-color: #17365d;
            color: white;
            border-radius: 4px;
        }

        .card h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <h1>My Three Card Designs</h1>

    <main class="card-container">
        <article class="card card-one">
            <h2>Classic Card</h2>
            <p>White background with a blue border.</p>
        </article>

        <article class="card card-two">
            <h2>Soft Card</h2>
            <p>Light blue background with rounded corners.</p>
        </article>

        <article class="card card-three">
            <h2>Dark Card</h2>
            <p>Dark background with a simple shape.</p>
        </article>
    </main>

</body>
</html>
