
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 30px auto;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>My Photo Gallery</h1>

    <main class="gallery">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Beautiful mountain landscape">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Lake surrounded by mountains">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Green forest and trees">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Mountain lake scenery">
        <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=600" alt="Wildlife in a natural landscape">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600" alt="Tall mountains under the sky">
    </main>

</body>
</html>
