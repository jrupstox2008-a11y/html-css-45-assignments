
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing - Flexbox</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .product-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .product-card {
            flex: 1 1 220px;
            max-width: 280px;
            padding: 20px;
            text-align: center;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px #00000015;
        }

        .product-image {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 130px;
            margin-bottom: 15px;
            background-color: #dbeafe;
            border-radius: 8px;
            font-size: 42px;
        }

        .product-card h2 {
            color: #1e40af;
            font-size: 20px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #15803d;
        }

        .product-card button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        .product-card button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <h1>Our Products</h1>

    <div class="product-list">

        <div class="product-card">
            <div class="product-image">🎧</div>
            <h2>Headphones</h2>
            <p>Comfortable wireless headphones.</p>
            <p class="price">₹1,499</p>
            <button type="button">View Product</button>
        </div>

        <div class="product-card">
            <div class="product-image">⌚</div>
            <h2>Smart Watch</h2>
            <p>A watch for your daily activities.</p>
            <p class="price">₹2,499</p>
            <button type="button">View Product</button>
        </div>

        <div class="product-card">
            <div class="product-image">🎒</div>
            <h2>Backpack</h2>
            <p>A practical bag for everyday use.</p>
            <p class="price">₹999</p>
            <button type="button">View Product</button>
        </div>

        <div class="product-card">
            <div class="product-image">👟</div>
            <h2>Sports Shoes</h2>
            <p>Comfortable shoes for daily wear.</p>
            <p class="price">₹1,999</p>
            <button type="button">View Product</button>
        </div>

    </div>

</body>
</html>
